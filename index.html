<style>

  html, body { margin: 0; padding: 0; background: #14120F; }
  a { color: #F1EADB; text-decoration: none; }
  a:hover { color: #EBC871; }
  [data-nav-burger] { display: none; }
  @media (max-width: 700px) {
    body { overflow-x: hidden; }
    [data-desktop-only] { display: none !important; }
    [data-nav-burger] { display: block; cursor: pointer; font-size: 20px; line-height: 1; padding: 6px 10px; border: 1px solid rgba(241,234,219,0.35); }

  @keyframes pbl-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (max-width: 700px) { [data-grid="mood"] { grid-template-columns: repeat(2, 1fr) !important; } }

@media (max-width: 700px) {
    [data-proj-hero] { aspect-ratio: 4/5 !important; margin-left: -8px !important; margin-right: -8px !important; }
    section[data-screen-label="Project detail"] { padding-left: 8px !important; padding-right: 8px !important; }
    section[data-screen-label="Work index"] { padding-left: 8px !important; padding-right: 8px !important; }
    [data-grid="three"] { grid-template-columns: repeat(1, 1fr) !important; gap: 8px !important; margin-left: -8px !important; margin-right: -8px !important; }
    [data-grid="three"] > div { grid-column: auto !important; }
}
.page,.project,#work-footer{display:none}
.page.active{display:flex;flex-direction:column}
#page-work.active,#page-project.active,#page-home.active{display:block}
.project.active,#work-footer.active{display:block}
.tile-meta:hover,a:hover .tile-meta{color:#EBC871}
img{max-width:100%}
[data-hv="0"]:hover{animation-play-state:paused !important}
[data-hv="1"]:hover{color:#EBC871 !important;border-color:#EBC871 !important}
[data-hv="2"]:hover{color:#EBC871 !important}
[data-hv="3"]:hover{color:#EBC871 !important}
